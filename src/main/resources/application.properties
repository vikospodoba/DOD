spring.application.name=DOD Deep Live Cam
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info

dod.worker.base-url=${DOD_WORKER_BASE_URL:http://127.0.0.1:8001}
dod.worker.timeout=${DOD_WORKER_TIMEOUT:10s}
dod.worker.frame-host=${DOD_WORKER_FRAME_HOST:}
dod.worker.frame-port=${DOD_WORKER_FRAME_PORT:8002}
dod.characters.directory=${DOD_CHARACTERS_DIR:characters}
dod.characters.default-character-id=${DOD_DEFAULT_CHARACTER_ID:default-human}
dod.web-socket.allowed-origins=${DOD_WS_ALLOWED_ORIGINS:*}
dod.web-socket.message-size-limit-bytes=${DOD_WS_MESSAGE_SIZE_LIMIT_BYTES:8388608}
